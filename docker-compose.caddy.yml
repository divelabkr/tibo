# HTTPS via Docker Caddy — 호스트에 이미 Caddy/IIS 가 있으면 쓰지 마세요.
# Windows 호스트 Caddy 사용: docker-compose.lan.yml + Caddyfile.windows
services:
  tibo:
    expose:
      - "80"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  caddy:
    image: caddy:2-alpine
    container_name: tibo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TIBO_DOMAIN: ${TIBO_DOMAIN:-belo.team}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@belo.team}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tibo

volumes:
  caddy_data:
  caddy_config:
