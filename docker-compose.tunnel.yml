# HTTPS via Cloudflare Tunnel — belo.team (포트포워딩 불필요)
# 대시보드 Public hostname:
#   belo.team      → http://tibo:80
#   www.belo.team  → http://tibo:80
# docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
services:
  tibo:
    expose:
      - "80"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tibo-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - tibo
